
name: Build CloudPlay APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK de debug
        run: gradle --no-daemon :app:assembleDebug
             
              - name: Gerar Hash Microsoft
        run: |
          keytool -exportcert -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            | openssl sha1 -binary | openssl base64

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudPlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk

